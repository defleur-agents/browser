<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#0B0B0D">
  <title>Browser handoff</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0B0D;
           color: #F2F2F2; font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 22rem; padding: 1.5rem; text-align: center; }
    h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
    p { margin: .4rem 0; color: rgba(242,242,242,.72); }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Connecting…</h1>
    <p id="detail"></p>
  </main>
  <script>
    (() => {
      // The handoff link is <this page>#<capability>. Forward it to the pinned
      // noVNC 1.3.0 client; every path is relative so the page works both on
      // the app's own port (/handoff/) and behind the Wizard app route.
      const dir = window.location.pathname.replace(/[^/]*$/, '');
      const token = window.location.hash.slice(1);
      const title = document.getElementById('title');
      const detail = document.getElementById('detail');
      const viewer = dir + 'client-1.3.0/vnc.html?' + new URLSearchParams({
        autoconnect: 'true',
        resize: 'scale',
        reconnect: 'true',
        reconnect_delay: '1500',
        path: (dir + 'websockify').replace(/^\//, ''),
        control: dir + 'control',
        v: '20260822-19',
      }).toString();
      history.replaceState(null, '', window.location.pathname + window.location.search);
      if (/^[A-Za-z0-9]{16,128}$/.test(token)) {
        window.location.replace(viewer + '#' + token);
        return;
      }
      title.textContent = 'Browser';
      detail.textContent = 'Checking for a handoff…';
      fetch(dir + 'state', {cache: 'no-store', credentials: 'same-origin'})
        .then((r) => r.json())
        .then((s) => {
          if (s.active && s.authorized) {
            window.location.replace(viewer);  // this device already holds the link's cookie
            return;
          }
          detail.textContent = s.active
            ? 'Your agent is waiting for you. Open the handoff link it sent you.'
            : 'No handoff is open. When your agent needs you for a login, code or CAPTCHA, it sends you a link that opens the live browser here.';
        })
        .catch(() => { detail.textContent = 'The browser is starting or not reachable.'; });
    })();
  </script>
</body>
</html>
