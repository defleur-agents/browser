name: Publish to the Wizard App Index
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated MCP front is up to date
        run: python3 mcp/inline.py --check
      - name: Unit tests (stdlib only)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  engine-image:
    # The browser-engine image the compose file runs: amd64 + arm64. Pushed only from main.
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from the compose file
        id: tag
        run: echo "image=$(grep -oE 'ghcr.io/[^ ]+/browser-engine:[^ ]+' runtipi/docker-compose.yml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    needs: engine-image
    runs-on: ubuntu-latest
    steps:
      - name: Publish (the index re-reads this repo and runs the wizard.md check)
        run: |
          curl -sS --fail-with-body -X POST https://apps.aiwizards.com/v1/publish \
            -H 'content-type: application/json' \
            -d "{\"repo\":\"${{ github.repository }}\"}"
